name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            deb: true
            rpm: true
            strip: strip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            deb: true
            rpm: true
            strip: aarch64-linux-gnu-strip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            strip: strip
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            strip: strip
          - target: x86_64-apple-darwin
            os: macos-latest
            strip: strip
          - target: aarch64-apple-darwin
            os: macos-latest
            strip: strip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          out="lineselect-${version}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/lineselect" "$out"
          ${{ matrix.strip }} "$out"
          shasum -a 256 "$out" > "${out}.sha256"

      - name: Build .deb package
        if: matrix.deb
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }} --no-build
          mv target/${{ matrix.target }}/debian/*.deb ./

      - name: Build .rpm package
        if: matrix.rpm
        run: |
          cargo install cargo-generate-rpm
          cargo generate-rpm --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/generate-rpm/*.rpm ./

      - name: Upload workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lineselect-${{ matrix.target }}
          path: |
            *.deb
            *.rpm
            lineselect-*-${{ matrix.target }}
            lineselect-*-${{ matrix.target }}.sha256

      - name: Upload artifacts
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
            lineselect-*-${{ matrix.target }}
            lineselect-*-${{ matrix.target }}.sha256

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
